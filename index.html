<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="航空气象知识库：基础大气理论、天气现象与成因、观测与预报产品、危险天气与飞行影响、法规标准，附备考自测题库与报文解码器。">
<title>航空气象知识库 · 个人备考</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F6FED'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' fill='white' font-weight='bold'%3E%E9%A3%9E%3C/text%3E%3C/svg%3E">
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#F4F7FB; --bg2:#EAF0F8; --card:#FFFFFF; --border:#E2E8F1; --border2:#D3DEEB;
  --text:#1B2530; --text2:#5A6A7C; --text3:#8A99AB;
  --accent:#2F6FED; --accent-2:#5B94F5; --accent-soft:#E8F0FE; --accent-deep:#1D4FB8;
  --danger:#D9484F; --danger-soft:#FDECEC;
  --warn:#C97E0E; --warn-soft:#FBF3E0;
  --ok:#2E9E5B; --ok-soft:#E7F5EC;
  --chip:#EDF2F9; --chip-text:#3E5C8A;
  --shadow:0 1px 3px rgba(16,42,84,.08), 0 8px 24px rgba(16,42,84,.06);
  --shadow-lg:0 4px 12px rgba(16,42,84,.10), 0 16px 40px rgba(16,42,84,.10);
  --radius:14px; --radius-sm:10px;
  --sidebar-w:272px;
  --header-h:60px;
}
[data-theme="dark"]{
  --bg:#0E1622; --bg2:#111C2B; --card:#172230; --border:#243349; --border2:#2E4059;
  --text:#E6EDF6; --text2:#9FB0C4; --text3:#6E8094;
  --accent:#6AA0FF; --accent-2:#8DB7FF; --accent-soft:#1B2B47; --accent-deep:#9DC1FF;
  --danger:#FF7B82; --danger-soft:#3A2126;
  --warn:#F0B04C; --warn-soft:#3A2F17;
  --ok:#5FCE8F; --ok-soft:#1D3327;
  --chip:#223044; --chip-text:#A9C3E6;
  --shadow:0 1px 3px rgba(0,0,0,.40), 0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 16px 40px rgba(0,0,0,.45);
}
/* ============ 基础 ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  background:var(--bg); color:var(--text); font-size:15px; line-height:1.75;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{line-height:1.4; font-weight:700}
mark{background:rgba(255,213,79,.55); color:inherit; border-radius:3px; padding:0 2px}
[data-theme="dark"] mark{background:rgba(240,176,76,.45)}
::selection{background:var(--accent); color:#fff}
button{font-family:inherit; cursor:pointer}
svg{display:block}

/* ============ 头部 ============ */
.site-header{
  position:sticky; top:0; z-index:60; height:var(--header-h);
  display:flex; align-items:center; gap:14px; padding:0 18px;
  background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; letter-spacing:.5px; white-space:nowrap}
.brand .logo{
  width:34px;height:34px;border-radius:10px;flex:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;color:#fff;
}
.search-wrap{flex:1; max-width:560px; margin:0 auto; position:relative}
.search-wrap input{
  width:100%; height:38px; border:1px solid var(--border2); border-radius:20px;
  background:var(--card); color:var(--text); padding:0 40px 0 38px; font-size:14px; outline:none;
  transition:border-color .15s, box-shadow .15s;
}
.search-wrap input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap .s-icon{position:absolute; left:13px; top:9px; color:var(--text3); pointer-events:none}
.search-wrap .s-clear{
  position:absolute; right:8px; top:6px; width:26px;height:26px;border:none;border-radius:50%;
  background:var(--chip); color:var(--text2); font-size:15px; line-height:1; display:none; align-items:center;justify-content:center;
}
.search-wrap .s-clear.show{display:flex}
.sr-results{
  position:absolute; top:44px; left:0; right:0; z-index:70; background:var(--card);
  border:1px solid var(--border2); border-radius:12px; box-shadow:var(--shadow-lg); max-height:60vh; overflow-y:auto; display:none;
}
.sr-results.show{display:block}
.sr-item{padding:9px 14px; border-bottom:1px solid var(--border); cursor:pointer; min-height:44px}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--accent-soft)}
.sr-item .sr-t{font-size:14px; font-weight:600; color:var(--text)}
.sr-item .sr-m{font-size:12px; color:var(--text3); margin-top:1px}
.sr-item .sr-s{font-size:12.5px; color:var(--text2); margin-top:2px}
.hd-actions{display:flex; gap:8px; margin-left:auto}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--border2);border-radius:11px;background:var(--card);color:var(--text2);
  display:flex;align-items:center;justify-content:center; transition:all .15s;
}
.icon-btn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
.menu-btn{display:none}

/* ============ 布局 ============ */
.layout{display:flex; min-height:calc(100vh - var(--header-h))}
.sidebar{
  width:var(--sidebar-w); flex:none; position:sticky; top:var(--header-h); height:calc(100vh - var(--header-h));
  overflow-y:auto; padding:16px 12px 30px; border-right:1px solid var(--border); background:var(--bg2);
  scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2); border-radius:3px}
.nav-group{margin-bottom:14px}
.nav-group .nav-title{
  display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px;
  font-size:13px; font-weight:700; color:var(--text2); letter-spacing:.5px;
  cursor:pointer; user-select:none; transition:background .12s;
}
.nav-group .nav-title:hover{background:var(--card)}
.nav-group .nav-title::after{
  content:""; width:7px; height:7px; margin-left:auto; flex:none;
  border-right:1.8px solid var(--text3); border-bottom:1.8px solid var(--text3);
  transform:rotate(45deg); transition:transform .15s; opacity:.75;
}
.nav-group.collapsed .nav-title::after{transform:rotate(-45deg)}
.nav-group.collapsed > a,
.nav-group.collapsed > .nav-sub{display:none}
.nav-group .nav-title .n-dot{width:8px;height:8px;border-radius:3px;flex:none}
.nav-group a{
  display:flex; align-items:center; gap:8px; padding:6px 10px 6px 26px; margin:1px 0;
  font-size:13.5px; color:var(--text2); border-radius:8px; text-decoration:none; transition:all .12s;
}
.nav-group a:hover{background:var(--card); color:var(--accent)}
.nav-group a.active{background:var(--accent-soft); color:var(--accent-deep); font-weight:600}
[data-theme="dark"] .nav-group a.active{color:var(--accent)}
.nav-group a .n-sub{font-size:11px; color:var(--text3); margin-left:auto; font-weight:400}

/* ============ 主内容 ============ */
.main{flex:1; min-width:0; padding:26px 30px 90px}
.main-inner{max-width:1020px; margin:0 auto}
.section-head{margin:8px 0 18px}
.section-head .kicker{font-size:13px; font-weight:700; letter-spacing:2px; color:var(--accent)}
.section-head h2{font-size:25px; margin-top:2px}
.section-head p{color:var(--text2); margin-top:6px; font-size:14.5px}

/* 总览条目列表 */
.ov-mod{margin-bottom:40px}
.topic-list{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px}
.topic-item{
  display:block; background:var(--card); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:11px 14px; box-shadow:var(--shadow); min-height:44px; transition:all .12s; cursor:pointer; text-decoration:none;
}
.topic-item:hover{border-color:var(--accent); box-shadow:var(--shadow-lg); text-decoration:none}
.topic-item .ti-t{font-size:14.5px; font-weight:600; color:var(--text); line-height:1.4}
.topic-item .ti-s{font-size:12.8px; color:var(--text2); margin-top:3px; line-height:1.5}
@media (max-width:760px){ .topic-list{grid-template-columns:1fr} }

/* 详情视图 */
.detail-bar{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.back-btn{
  display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:7px 16px;
  border:1px solid var(--border2); background:var(--card); color:var(--accent); border-radius:10px; font-size:14px; font-weight:600; text-decoration:none;
}
.back-btn:hover{background:var(--accent-soft); text-decoration:none}
.crumb{font-size:13px; color:var(--text3)}
.crumb b{color:var(--text2)}
.detail-nav{display:flex; justify-content:space-between; gap:12px; margin-top:22px; flex-wrap:wrap}
.detail-nav a{
  flex:1; min-width:180px; min-height:48px; display:flex; flex-direction:column; justify-content:center;
  border:1px solid var(--border2); background:var(--card); border-radius:var(--radius-sm);
  padding:10px 14px; text-decoration:none; color:var(--text);
}
.detail-nav a:hover{border-color:var(--accent); background:var(--accent-soft); text-decoration:none}
.detail-nav .dn-lab{font-size:11.5px; color:var(--text3)}
.detail-nav .dn-t{font-size:13.5px; font-weight:600; margin-top:2px}
.detail-nav .dn-next{text-align:right}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px 22px; margin:14px 0; box-shadow:var(--shadow);
}
.card h3{font-size:17.5px; display:flex; align-items:center; gap:9px; margin-bottom:12px}
.card h3 .m-ico{width:28px;height:28px;border-radius:8px;flex:none; display:flex;align-items:center;justify-content:center;color:#fff}
.card h4{font-size:15px; margin:16px 0 6px}
.card p{margin:7px 0}
.card ul,.card ol{margin:7px 0 7px 22px}
.card li{margin:3.5px 0}
.card strong{color:var(--accent-deep)}
[data-theme="dark"] .card strong{color:var(--accent)}
.card code{font-family:Consolas,Menlo,monospace; background:var(--chip); padding:1px 6px; border-radius:5px; font-size:13px}

/* 表格 */
.tbl-wrap{overflow-x:auto; margin:10px 0; border:1px solid var(--border); border-radius:var(--radius-sm)}
table.tbl{width:100%; border-collapse:collapse; font-size:13.5px; table-layout:fixed}
.tbl th{background:var(--bg2); text-align:left; padding:8px 12px; font-size:13px; color:var(--text2); border-bottom:1px solid var(--border); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.tbl td{padding:7px 12px; border-bottom:1px solid var(--border); vertical-align:top; word-break:break-word}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:nth-child(even) td{background:color-mix(in srgb, var(--card) 90%, var(--bg2))}

/* 标签与提示 */
.chips{display:flex; flex-wrap:wrap; gap:7px; margin:8px 0}
.chip{
  display:inline-flex; align-items:center; gap:5px; padding:3px 11px; border-radius:999px;
  background:var(--chip); color:var(--chip-text); font-size:12.5px; font-weight:600;
}
.chip.blue{background:var(--accent-soft); color:var(--accent-deep)}
[data-theme="dark"] .chip.blue{color:var(--accent)}
.chip.red{background:var(--danger-soft); color:var(--danger)}
.chip.green{background:var(--ok-soft); color:var(--ok)}
.chip.amber{background:var(--warn-soft); color:var(--warn)}
.callout{border-radius:var(--radius-sm); padding:12px 15px; margin:12px 0; font-size:13.8px; border:1px solid transparent}
.callout.tip{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 25%, transparent)}
.callout.tip b{color:var(--accent-deep)}
[data-theme="dark"] .callout.tip b{color:var(--accent)}
.callout.warn{background:var(--warn-soft); border-color:color-mix(in srgb, var(--warn) 30%, transparent)}
.callout.warn b{color:var(--warn)}
.callout.danger{background:var(--danger-soft); border-color:color-mix(in srgb, var(--danger) 25%, transparent)}
.callout.danger b{color:var(--danger)}
.callout .co-t{font-weight:700; margin-bottom:3px; display:block}

/* 双栏 */
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px}
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px}
.stat-box{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; text-align:center; box-shadow:var(--shadow)}
.stat-box .num{font-size:26px; font-weight:800; color:var(--accent)}
.stat-box .lab{font-size:12.5px; color:var(--text2); margin-top:2px}

/* 示意图容器 */
.fig{background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin:12px 0; overflow-x:auto}
.fig svg{width:100%; height:auto; max-width:880px; margin:0 auto}
.fig-cap{font-size:12.5px; color:var(--text3); text-align:center; margin-top:6px}
.fig-cap b{color:var(--text2)}

/* 代码块（报文） */
.code{
  font-family:Consolas,"Cascadia Mono",Menlo,monospace; font-size:13px; line-height:1.7;
  background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm);
  padding:12px 14px; margin:10px 0; overflow-x:auto; white-space:pre-wrap; word-break:break-word;
}
.code .tok{display:inline-block; padding:0 5px; margin:1px 2px; border-radius:5px; cursor:help}
.tok.t-fmt{background:rgba(47,111,237,.15); color:var(--accent-deep)}
.tok.t-time{background:rgba(46,158,91,.15); color:var(--ok)}
.tok.t-wind{background:rgba(201,126,14,.16); color:var(--warn)}
.tok.t-vis{background:rgba(147,101,184,.15); color:#8A5BB5}
.tok.t-wx{background:rgba(217,72,79,.14); color:var(--danger)}
.tok.t-cloud{background:rgba(43,166,160,.15); color:#1E8A85}
.tok.t-temp{background:rgba(94,129,244,.15); color:#5E81F4}
.tok.t-qnh{background:rgba(120,90,200,.15); color:#7A5AC8}
.tok.t-trend{background:rgba(96,130,110,.16); color:#3E7A50}
.tok.t-meta{background:rgba(0,0,0,.06); color:var(--text3)}
[data-theme="dark"] .tok{color:var(--text)}
[data-theme="dark"] .tok.t-fmt{color:#A9C3FF}
[data-theme="dark"] .tok.t-time{color:#7FE0A8}
[data-theme="dark"] .tok.t-wind{color:#F0B04C}
[data-theme="dark"] .tok.t-vis{color:#C9A0F0}
[data-theme="dark"] .tok.t-wx{color:#FF8D93}
[data-theme="dark"] .tok.t-cloud{color:#7FD8D3}
[data-theme="dark"] .tok.t-temp{color:#9FB6FF}
[data-theme="dark"] .tok.t-qnh{color:#B39DF0}

/* 解码器 */
.decoder .d-input{display:flex; gap:8px; flex-wrap:wrap}
.decoder input{
  flex:1; min-width:240px; height:42px; border:1px solid var(--border2); border-radius:10px;
  background:var(--card); color:var(--text); padding:0 14px; font-family:Consolas,Menlo,monospace; font-size:13px; outline:none;
}
.decoder input:focus{border-color:var(--accent)}
.decoder .d-btn{height:42px; padding:0 18px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:14px; font-weight:600}
.decoder .d-btn:hover{background:var(--accent-deep)}
.d-samples{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
.d-samples button{
  border:1px solid var(--border2); background:var(--card); color:var(--text2); border-radius:8px;
  padding:4px 10px; font-size:12px; font-family:Consolas,Menlo,monospace;
}
.d-samples button:hover{border-color:var(--accent); color:var(--accent)}
.d-out{margin-top:12px; display:none}
.d-out.show{display:block}
.d-out .d-line{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--border)}
.d-out .d-line:last-child{border-bottom:none}
.d-out .d-tok{flex:none; font-family:Consolas,Menlo,monospace; font-size:12.5px; padding:2px 9px; border-radius:7px; min-width:88px; text-align:center}
.d-out .d-exp{font-size:13px; color:var(--text2)}
.d-out .d-exp b{color:var(--text)}

/* 自测 */
.quiz-toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:12px 0}
.q-chip{border:1px solid var(--border2); background:var(--card); color:var(--text2); border-radius:999px; padding:5px 14px; font-size:13px}
.q-chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.q-progress{font-size:13px; color:var(--text2); margin-left:auto}
.q-card{max-width:760px; margin:0 auto}
.q-card .q-meta{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
.q-card .q-text{font-size:16px; font-weight:600; margin-bottom:14px; line-height:1.7}
.q-opt{
  display:block; width:100%; text-align:left; border:1.5px solid var(--border2); background:var(--card);
  border-radius:12px; padding:11px 15px; margin:8px 0; font-size:14.5px; color:var(--text); transition:all .12s;
}
.q-opt:hover:not(:disabled){border-color:var(--accent); background:var(--accent-soft)}
.q-opt .q-letter{display:inline-flex; width:24px;height:24px;border-radius:7px; background:var(--chip); align-items:center;justify-content:center; font-size:12.5px; font-weight:700; margin-right:10px; color:var(--chip-text)}
.q-opt.correct{border-color:var(--ok); background:var(--ok-soft)}
.q-opt.correct .q-letter{background:var(--ok); color:#fff}
.q-opt.wrong{border-color:var(--danger); background:var(--danger-soft)}
.q-opt.wrong .q-letter{background:var(--danger); color:#fff}
.q-opt:disabled{cursor:default; opacity:.9}
.q-exp{margin-top:14px; border-left:3px solid var(--accent); background:var(--bg2); border-radius:0 10px 10px 0; padding:11px 15px; font-size:13.8px; display:none}
.q-exp.show{display:block}
.q-next{margin-top:14px}
.q-next button{border:none; background:var(--accent); color:#fff; border-radius:10px; padding:10px 26px; font-size:14px; font-weight:600}
.q-next button:hover{background:var(--accent-deep)}
.q-next button:disabled{background:var(--border2); cursor:default}
.q-done{text-align:center; padding:30px 10px}
.q-done .big{font-size:44px; font-weight:800; color:var(--accent)}
.q-done .sub{color:var(--text2); margin:6px 0 18px}
.q-best{font-size:12.5px; color:var(--text3); margin-top:10px}

/* 返回顶部 */
#toTop{
  position:fixed; right:22px; bottom:24px; z-index:50; width:44px;height:44px; border-radius:50%;
  border:1px solid var(--border2); background:var(--card); color:var(--accent); box-shadow:var(--shadow-lg);
  display:none; align-items:center; justify-content:center; font-size:18px;
}
#toTop.show{display:flex}
footer.site-foot{border-top:1px solid var(--border); padding:22px 0 30px; text-align:center; color:var(--text3); font-size:12.5px}

/* ============ 响应式 ============ */
@media (max-width:960px){
  .menu-btn{display:flex}
  .nav-group .nav-title{min-height:44px; padding-top:8px; padding-bottom:8px}
  .nav-group a{min-height:44px; padding-top:4px; padding-bottom:4px}
  .sidebar{
    position:fixed; left:0; top:var(--header-h); bottom:0; z-index:55;
    transform:translateX(-105%); transition:transform .22s ease; box-shadow:var(--shadow-lg);
  }
  .sidebar.open{transform:translateX(0)}
  .sidebar-mask{position:fixed; inset:0; background:rgba(10,20,35,.45); z-index:54; backdrop-filter:blur(2px)}
  .main{padding:20px 16px 80px}
}
@media (max-width:560px){
  .site-header{padding:0 12px; gap:10px}
  .brand span.t{display:none}
  .search-wrap{max-width:none}
  .section-head h2{font-size:21px}
  .card{padding:16px}
  .fig{padding:8px}
}
@media print{
  .site-header,.sidebar,#toTop,.quiz-toolbar{display:none !important}
  .layout{display:block}
  .main{padding:0}
  body{background:#fff}
  .card{box-shadow:none; break-inside:avoid}
}
</style>
</head>
<body>

<header class="site-header">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开导航">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

    <span class="logo">

  var root = document.documentElement;

  var iconSun = document.getElementById('themeIconSun');
  function setTheme(t){
    root.setAttribute('data-theme', t);

    if(iconMoon) iconMoon.style.display = (t === 'dark') ? 'none' : '';
    if(iconSun) iconSun.style.display = (t === 'dark') ? '' : 'none';
  }
  var saved = null;
  try{ saved = localStorage.getItem('amkb_theme'); }catch(e){}
  setTheme(saved === 'dark' ? 'dark' : 'light');
  if(themeBtn) themeBtn.addEventListener('click', function(){
    setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
})();

var MODULES=[
 {id:'m1',num:'一',kicker:'MODULE 01 · ATMOSPHERE BASICS',title:'一 · 基础大气理论',desc:'大气结构、标准状态、气压温度湿度风与气团锋——理解一切天气现象的底层逻辑。',color:'#2F6FED'},
 {id:'m2',num:'二',kicker:'MODULE 02 · WEATHER PHENOMENA',title:'二 · 天气现象与成因',desc:'云、降水、雾、雷暴、锋、台风、积冰、颠簸、风切变与沙尘火山灰。',color:'#1E8A85'},
 {id:'m3',num:'三',kicker:'MODULE 03 · OBSERVATIONS & FORECAST PRODUCTS',title:'三 · 观测与预报产品',desc:'METAR/SPECI、TAF、RMK 注释组、缩略语、SIGMET/AIRMET、ATIS/VOLMET 与报文解码器。',color:'#8A5BB5'},

];
var TOPICS=[
{t:'m1-1',m:'m1',ti:'大气结构与垂直分层',s:'按温度垂直递减率分五层，对流层集中天气现象与几乎全部水汽。',h:`<p>大气由干洁空气、水汽、杂质三部分组成：氮气约 <strong>78%</strong>、氧气约 <strong>21%</strong>、氩气等痕量气体约 1%。其中<strong>水汽集中在对流层</strong>（1.5~2 km 高处约为地面一半，5 km 处仅 1/10），是成云致雨与释放凝结潜热的物质基础；臭氧主要集中在 10~50 km（最大浓度 20~30 km），吸收紫外线使平流层增温。</p>
<p>按气温垂直递减率 γ=-ΔT/ΔZ，大气自下而上分为五层：对流层、平流层、中间层（至 85 km）、暖层（至 800 km）、散逸层。γ=0 为等温层，γ&lt;0 为逆温层。</p>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:22%"><col style="width:30%"><col style="width:48%"></colgroup>
<tr><th>层次</th><th>高度</th><th>特征与飞行意义</th></tr>
<tr><td><strong>对流层</strong></td><td>低纬 17~18 km / 中纬 10~12 km / 高纬 8~9 km</td><td>集中大气质量约 3/4 与几乎全部水汽；平均 γ≈0.65℃/100m；云、雨、雷暴、颠簸、积冰都在此；对流层顶极地低、赤道高，附近有急流</td></tr>
<tr><td><strong>平流层</strong></td><td>对流层顶~55 km</td><td>20 km 以上因臭氧吸热而逆温；水平运动为主、天气晴朗，民航巡航层（FL350~FL410）</td></tr>
<tr><td>中间层</td><td>~85 km</td><td>温度随高度降低，流星多在此烧毁</td></tr>
<tr><td>暖层/散逸层</td><td>85 km 以上</td><td>电离层影响高频通信，与常规飞行基本无关</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span><b>分层顺序</b>：对流层→平流层→中间层→暖层→散逸层；<b>温度趋势</b>降→升→降→升；对流层高度<b>夏季&gt;冬季、低纬&gt;高纬</b>；巡航层在平流层下部。</div>`},
{t:'m1-2',m:'m1',ti:'标准大气（ISA）',s:'海平面 15℃、1013.25 hPa、1.225 kg/m³，对流层直减率 0.65℃/100m。',h:`<p>标准大气是代表大气平均状态的假想垂直模型，用于高度表校准与飞机性能计算，数值必须照原文记忆。</p>
<div class="stat-grid">
<div class="stat-box"><div class="num">15℃</div><div class="lab">海平面温度（288.15 K）</div></div>
<div class="stat-box"><div class="num">1013.25</div><div class="lab">海平面气压 hPa（760 mmHg / 29.92 inHg / 1 atm）</div></div>
<div class="stat-box"><div class="num">1.225</div><div class="lab">海平面密度 kg/m³</div></div>
<div class="stat-box"><div class="num">0.65℃/100m</div><div class="lab">对流层直减率</div></div>
<div class="stat-box"><div class="num">-56.5℃</div><div class="lab">11 km 处温度（等温层）</div></div>
</div>
<ul>
<li>11000 m 以下直减率 <strong>0.65℃/100m</strong>；11~20 km 等温 -56.5℃；20~30 km 直减率 -0.1℃/100m。</li>
<li>低空近似：<strong>1 hPa ≈ 27 ft ≈ 8.3 m</strong>；等压面近似高度：850≈1.5 km、700≈3.0 km、500≈5.5 km、300≈9.1 km、200≈11.8 km。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>一套数字：<b>15 / 1013.25 / 1.225 / 0.65℃每百米 / -56.5</b>；1013.25 hPa 同时用于 QNE 与过渡高度层。</div>`},
{t:'m1-3',m:'m1',ti:'气压与气压高度基准',s:'气压随高度递减；QFE/QNH/QNE 三种高度表基准对应不同基准面。',h:`<p><strong>气压</strong>是单位面积上大气柱的重量。静力学方程 dp=-ρgdz：气压随高度降低，越往下降得越慢。1 atm=1013.25 hPa=760 mmHg=29.92 inHg。</p>
<h4>三种高度基准（必背）</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:18%"><col style="width:42%"><col style="width:40%"></colgroup>
<tr><th>基准</th><th>含义</th><th>高度基准面</th></tr>
<tr><td><strong>QFE</strong></td><td>场面气压</td><td>相对跑道面/机场标高（精密跑道以入口标高为准）</td></tr>
<tr><td><strong>QNH</strong></td><td>修正海平面气压</td><td>相对平均海平面</td></tr>
<tr><td><strong>QNE</strong></td><td>标准海平面气压 1013.25 hPa</td><td>相对标准面，航线与过渡高度层使用</td></tr>
</table></div>
<h4>水平气压场</h4>
<ul>
<li>基本形式：低压/低压槽、高压/高压脊、鞍形场；气压梯度 Gn 垂直等压线由高压指向低压，等压线越密梯度越大。</li>
<li>北半球低压逆时针辐合上升（阴雨），高压顺时针辐散下沉（晴好）。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>QFE=跑道面、QNH=海平面、QNE=标准面；<b>QFE 只在本场报告与俄式 RMK 中，METAR/SPECI 只发 QNH</b>。</div>`},
{t:'m1-4',m:'m1',ti:'温度与大气稳定度',s:'干绝热约1℃/100m、湿绝热0.4~0.7℃/100m；与实际直减率比较判断稳定度。',h:`<h4>三种直减率</h4>
<ul>
<li><strong>气温直减率 γ（ELR）</strong>：实际大气平均约 0.65℃/100m。</li>
<li><strong>干绝热 γd</strong>：未饱和空气约 <strong>1℃/100m</strong>。</li>
<li><strong>湿绝热 γm</strong>：饱和空气因释放潜热，约 <strong>0.4~0.7℃/100m</strong>。</li>
</ul>
<h4>稳定度判别</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:34%"><col style="width:66%"></colgroup>
<tr><th>层结</th><th>判别</th></tr>
<tr><td><strong>绝对稳定</strong></td><td>γ &lt; γm（降温太慢，气块下沉）</td></tr>
<tr><td><strong>条件性不稳定</strong></td><td>γm &lt; γ &lt; γd（饱和后才不稳定，常考）</td></tr>
<tr><td><strong>绝对不稳定</strong></td><td>γ &gt; γd（气块持续上升）</td></tr>
</table></div>
<p>对流：垂直速度 1~10 m/s，水平几~几十 km；系统性垂直运动仅 1~10 cm/s，水平几百~几千 km。T-lnP 图上状态曲线在层结曲线右侧为正不稳定能量。</p>
<h4>逆温（极强稳定）</h4>
<ul>
<li><strong>辐射逆温</strong>：晴夜微风地面辐射冷却，秋冬清晨最强，利于雾和霾。</li>
<li><strong>下沉逆温</strong>：高压区空气下沉增温；<strong>锋面逆温</strong>：暖空气爬升到冷空气上，多伴低云冻雨；<strong>平流逆温</strong>：暖空气流经冷下垫面。</li>
</ul>
<div class="callout warn"><span class="co-t">飞行关联</span>逆温层上下常出现低空急流与风切变，也是雾、霾、低云、冻雨的温床。</div>
<div class="callout tip"><span class="co-t">考点速记</span>干 1℃/百米、湿 0.4~0.7、实际 0.65；口诀：<b>实际小于湿绝热→绝对稳定；大于干绝热→绝对不稳定；之间→条件性不稳定</b>。</div>`},
{t:'m1-5',m:'m1',ti:'湿度与水汽',s:'相对湿度随升温下降；露点差接近0易雾；过冷水滴是积冰来源。',h:`<ul>
<li><strong>相对湿度 f=e/E×100%</strong>：水汽不变时升温则 f 下降、降温则 f 上升，降至 100% 即凝结。</li>
<li><strong>饱和水汽压 E</strong>仅随温度升高而增大（每升 10℃约翻一倍）。</li>
<li><strong>露点</strong>：气压不变冷却到饱和的温度；露点差 t-td 越小越潮湿，<strong>t-td≤2℃ 即可能成雾</strong>。</li>
<li><strong>过冷水滴</strong>：0℃以下仍液态（可低至约 -40℃），是飞机积冰直接来源；-40℃以下云中基本全为冰晶。</li>
<li>凝结需凝结核（尘埃、盐粒、烟粒）。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>露点差≈0→雾/低云；过冷水滴→积冰；温度越高空气能装的水汽越多。</div>`},
{t:'m1-6',m:'m1',ti:'风与大气环流',s:'风压定理、三圈环流、急流与局地风；急流伴晴空湍流。',h:`<h4>风的受力与类型</h4>
<ul>
<li>风向指风的来向，真北为基准；摩擦层指地面至约 1500 m。</li>
<li><strong>地转风</strong>：气压梯度力与地转偏向力平衡，沿等压线吹，北半球背风而立<strong>高压在右、低压在左</strong>。</li>
<li><strong>摩擦层风</strong>斜穿等压线偏向低压；热成风由水平温度梯度形成，北半球背风而立高温在右、低温在左。</li>
</ul>
<h4>三圈环流与急流</h4>
<p>由赤道向北：东北信风带→副热带高压带→盛行西风带→副极地低压带→极地东风带。<strong>急流</strong>是风速≥30 m/s 的强西风带：极锋急流（中高纬、8~10 km、冬季强）与副热带急流（25~32°N、11~13 km），与<strong>晴空湍流 CAT</strong> 伴生。</p>
<h4>局地风</h4>
<ul>
<li><strong>海陆风</strong>：昼海风、夜陆风；<strong>山谷风</strong>：昼谷风、夜山风。</li>
<li><strong>焚风</strong>：气流越山下沉增温，背风坡每降 1000 m 升温约 6.5℃。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>风带由赤道向北：信风→西风→极地东风；急流在对流层顶附近、冬季强；顺风增加滑跑距离、逆风缩短。</div>`},
{t:'m1-7',m:'m1',ti:'气团与锋',s:'气团按热力/地理分类；冷锋陡而激烈、暖锋缓而绵长。',h:`<h4>气团</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:30%"><col style="width:34%"><col style="width:36%"></colgroup>
<tr><th>类型</th><th>性质</th><th>天气</th></tr>
<tr><td>cP 极地大陆</td><td>干冷</td><td>冬季南下寒潮、晴冷大风</td></tr>
<tr><td>mP 极地海洋</td><td>湿冷</td><td>云、雨雪、能见度较差</td></tr>
<tr><td>cT 热带大陆</td><td>干热</td><td>晴热少云</td></tr>
<tr><td>mT 热带海洋</td><td>湿热</td><td>不稳定、雷暴阵雨</td></tr>
</table></div>
<p>冷气团移向下垫面下部增温→不稳定多积状云、阵性降水；暖气团移动下部冷却→稳定多层状云、连续降水。影响我国：冬季西伯利亚气团+热带太平洋气团，夏季以热带太平洋气团为主。</p>
<h4>锋面天气</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:16%"><col style="width:42%"><col style="width:42%"></colgroup>
<tr><th>锋型</th><th>过境特征</th><th>过境后</th></tr>
<tr><td><strong>冷锋</strong></td><td>坡度陡、大风阵性降水雷暴、气温气压急变</td><td>干冷晴朗能见度转好</td></tr>
<tr><td><strong>暖锋</strong></td><td>云系 Ci→Cs→As→Ns、锋前连续降水、锋面逆温</td><td>气温上升降水渐止</td></tr>
<tr><td>静止锋/锢囚锋</td><td>持续低云低能见度/云雨区宽天气复杂</td><td>—</td></tr>
</table></div>
<div class="callout danger"><span class="co-t">飞行关联</span>锋区是风切变+颠簸+低云低能见度+积冰的"四合一"风险区；暖锋/静止锋锋面逆温可致<strong>冻雨</strong>。锋面坡度最小的是准静止锋；冷锋雷暴强度大、移动快。</div>`},
{t:'m1-8',m:'m1',ti:'空气密度与飞行性能',s:'高温高湿低密度使滑跑增长、爬升率下降、载重受限。',h:`<p>由气体状态方程 P=ρR比T：空气密度与气压成正比、与气温成反比，水汽越多密度越小。<strong>高温、高湿、低密度</strong>（高温高原机场）对性能不利。</p>
<ul>
<li>起飞滑跑距离增长、爬升率下降。</li>
<li>着陆真空速增大、着陆速度增大。</li>
<li>可用业载减小。</li>
</ul>
<p>气温三温标：摄氏（冰点0℃、沸点100℃）、华氏（32~212℉）、绝对温标 K（T=t+273.15）。非绝热变化四途径：辐射、乱流、水相变化、传导。气温日变化最低在日出前后、最高在正午约 2 小时后；日较差低纬&gt;高纬、夏&gt;冬、陆&gt;海、晴&gt;阴。</p>
<div class="callout tip"><span class="co-t">考点速记</span>高温高湿=低密度=滑跑增长/爬升下降/载重减小；逆风缩短滑跑、顺风增加滑跑。</div>`},
{t:'m1-9',m:'m1',ti:'常用航空气象图表识读',s:'地面图、等压面图与 T-lnP 图的读图要点与等压面高度。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:26%"><col style="width:74%"></colgroup>
<tr><th>产品</th><th>要点</th></tr>
<tr><td><strong>地面图</strong></td><td>等压线每隔 2.5 hPa；高压蓝色 H、低压红色 L；站圈填风/云/天气/温露</td></tr>
<tr><td><strong>等压面图</strong></td><td>等高线每隔 4 位势什米、等温线每隔 4℃；槽线切变线用棕色实线；高空风羽短羽 10 kt、长羽 20 kt、三角旗 50 kt</td></tr>
<tr><td><strong>T-lnP 图</strong></td><td>层结曲线（黑实线）、露点曲线、状态曲线；凝结高度=状态线与露点线交点；自由对流高度=状态线与层结线交点</td></tr>
</table></div>
<ul>
<li>等压面高度：850≈1500 m、700≈3000 m、500≈5500 m、300≈9000 m、200≈12000 m。</li>
<li>500 hPa 上以 <strong>588 位势什米</strong>表征西太平洋副热带高压。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>850 看低层风温、500 看环流形势与副高、300/200 看急流；风羽读数 10/20/50 kt。</div>`},
{t:'m2-1',m:'m2',ti:'云的形成与分类',s:'三族14类；积状/层状/波状；云底高度分高、中、低云。',h:`<p>云是悬浮在大气中大量小水滴或小冰晶，凝结或凝华而成，需要水汽上升冷却+凝结核。</p>
<h4>三族十类</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:18%"><col style="width:42%"><col style="width:40%"></colgroup>
<tr><th>族</th><th>高度范围</th><th>常见云属</th></tr>
<tr><td><strong>高云</strong></td><td>中纬 5~13 km</td><td>Ci 卷云、Cs 卷层云、Cc 卷积云（冰晶组成、不降水）</td></tr>
<tr><td><strong>中云</strong></td><td>2~7 km</td><td>As 高层云、Ac 高积云（可有微量降水）</td></tr>
<tr><td><strong>低云</strong></td><td>地面~2 km</td><td>Sc 层积云、St 层云、Ns 雨层云、Cu 积云、Cb 积雨云</td></tr>
</table></div>
<h4>按结构分</h4>
<ul>
<li><strong>积状云</strong>：垂直发展、孤立分散，Cu→TCu→Cb，对流旺盛，伴阵性降水与雷暴。</li>
<li><strong>层状云</strong>：水平伸展均匀，Ci→Cs→As→Ns，连续降水，能见度差。</li>
<li><strong>波状云</strong>：Cs、Ac、Sc 中的波状排列，起伏不大、天气相对平稳。</li>
</ul>
<p><strong>特殊指示云</strong>：堡状高积云（Castellanus）预示上午午后可能有雷雨；荚状云（Lenticularis）指示山脉背风波；悬球状云（Mammatus）伴强烈雷暴云底。</p>
<div class="callout tip"><span class="co-t">考点速记</span>高云三字首字母为 C；<b>低云对起降影响最大</b>；堡状云/悬球状云是坏天气信号。</div>`},
{t:'m2-2',m:'m2',ti:'降水与降水强度',s:'降水形态取决于云气温结构；降水量按 mm/d 分级。',h:`<p>降水从云中降落到地面：<strong>雨</strong>（液态）、<strong>雪</strong>（冰晶）、<strong>霰/冰雹</strong>（过冷水冻结）、<strong>毛毛雨</strong>（极小滴）。</p>
<h4>形态与气温的关系</h4>
<ul>
<li><strong>雪/冰晶</strong>：整层气温在 0℃ 以下。</li>
<li><strong>雨</strong>：云下有暖层，雪融化成雨。</li>
<li><strong>冻雨</strong>：暖层下方有浅薄过冷层，雨滴过冷落地再冻结，极危险。</li>
<li><strong>雨幡</strong>：降水在到达地面前蒸发，空中下垂的幡状，常见于沙漠。</li>
</ul>
<h4>强度等级（24 小时降水量 mm/d）</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:30%"><col style="width:35%"><col style="width:35%"></colgroup>
<tr><th>降雨</th><th>等级</th><th>降雪（24h）</th></tr>
<tr><td>&lt;10</td><td>小雨</td><td>小雪 0.1~2.4</td></tr>
<tr><td>10~25</td><td>中雨</td><td>中雪 2.5~4.9</td></tr>
<tr><td>25~50</td><td>大雨</td><td>大雪 5.0~9.9</td></tr>
<tr><td>&gt;50</td><td>暴雨</td><td>暴雪 ≥10</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span>冻雨=暖层+过冷层；雨幡=蒸发不达地面；暴雨 24h≥50 mm。</div>`},
{t:'m2-3',m:'m2',ti:'雾与低能见度',s:'辐射/平流/上坡/锋面/蒸汽雾；t-td≤2℃ 成雾。',h:`<p>雾是接地的水汽凝结，水平能见度＜1 km；霾、轻雾视程≥1 km。</p>
<h4>五种雾</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:20%"><col style="width:40%"><col style="width:40%"></colgroup>
<tr><th>雾型</th><th>成因</th><th>多发条件</th></tr>
<tr><td><strong>辐射雾</strong></td><td>晴夜微风地面辐射冷却</td><td>秋冬清晨、日开后消散、范围局地</td></tr>
<tr><td><strong>平流雾</strong></td><td>暖湿空气流经冷下垫面</td><td>沿海、持续可达数百 km、日变化小</td></tr>
<tr><td>上坡雾</td><td>空气沿坡抬升冷却</td><td>山坡迎风面</td></tr>
<tr><td>锋面雾</td><td>锋面降水蒸发冷却</td><td>暖锋前</td></tr>
<tr><td>蒸汽雾</td><td>冷空气流过暖水面</td><td>秋冬湖面海面蒸汽</td></tr>
</table></div>
<h4>视程障碍八现象</h4>
<p>雾（FG）、轻雾（BR）、烟（FU）、霾（HZ）、沙暴（SA）、扬沙（SA）、浮尘（DU）、吹雪（BLSN）。<strong>主导能见度</strong>：观测者四周半圈以上（或跑道方向）的最低能见度，约 1.5 m 高观测；<strong>RVR</strong> 在跑道接地区约 2.5 m 高测量。</p>
<div class="callout warn"><span class="co-t">飞行关联</span>着陆能见度约为主导能见度的 <strong>60%</strong>；RVR 报至最近米，主导能见度报至最近百米。</div>
<div class="callout tip"><span class="co-t">考点速记</span>辐射雾局地晨发午散；平流雾沿海持久；BR≥1 km、FG&lt;1 km；RVR 单位米。</div>`},
{t:'m2-4',m:'m2',ti:'雷暴形成与生命周期',s:'三条件+三阶段；热/地形/锋面三类雷暴；云下有"气压鼻"。',h:`<h4>形成三条件</h4>
<ul>
<li>充沛水汽；<strong>不稳定大气</strong>；<strong>抬升触发机制</strong>（地面受热、地形、锋面）。</li>
</ul>
<h4>三类雷暴</h4>
<ul>
<li><strong>热雷暴</strong>：午后地面受热，孤立分散，傍晚消散。</li>
<li><strong>地形雷暴</strong>：迎风坡抬升，迎风面强。</li>
<li><strong>锋面/高空槽雷暴</strong>：冷锋前暖区，范围大移动快，是最危险类型。</li>
</ul>
<h4>三阶段与数值</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:18%"><col style="width:40%"><col style="width:42%"></colgroup>
<tr><th>阶段</th><th>气流</th><th>特征</th></tr>
<tr><td>积云阶段</td><td>上升气流</td><td>发展、无降水、云顶-20~-40℃</td></tr>
<tr><td>成熟阶段</td><td>上升+下沉共存</td><td>最强、出现降水与冰雹、云顶可达对流层顶</td></tr>
<tr><td>消散阶段</td><td>以下沉为主</td><td>降水减弱、云体瓦解</td></tr>
</table></div>
<p>生命史约 1~1.5 小时。云下出现强冷下沉气流堆，地面形成高压中心，温度突降、气压短时升高后下降，称为<strong>"气压鼻"</strong>。雷击多发生在云顶温度 -10~-20℃ 区域；强下击暴流常出现在成熟阶段消散前。</p>
<div class="callout danger"><span class="co-t">飞行关联</span>雷暴区应绕飞 <strong>≥20 km</strong>；严禁穿越。</div>
<div class="callout tip"><span class="co-t">考点速记</span>三条件=水汽+不稳定+抬升；三阶段=积云/成熟/消散；成熟阶段最强；"气压鼻"在云下。</div>`},
{t:'m2-5',m:'m2',ti:'飞机积冰',s:'四类积冰；强积冰多出现在-2~-10℃；翼尖先积冰。',h:`<p>积冰发生在云中过冷水滴撞击机体后冻结，需要云中存在 0℃ 以下的过冷水滴。</p>
<h4>四种积冰</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:16%"><col style="width:42%"><col style="width:42%"></colgroup>
<tr><th>类型</th><th>成因</th><th>危害</th></tr>
<tr><td><strong>明冰</strong></td><td>大过冷水滴在 -10~0℃ 慢冻结</td><td>透明坚硬、附着强、难清除，最危险</td></tr>
<tr><td><strong>雾凇</strong></td><td>小滴快速冻结、含气泡</td><td>乳白色粗糙、易脱落</td></tr>
<tr><td><strong>毛冰</strong></td><td>大小滴混合</td><td>粗糙半透明，危害大</td></tr>
<tr><td><strong>霜</strong></td><td>晴朗夜间机体辐射冷却使水汽凝华</td><td>停场时形成，起飞前必须除净</td></tr>
</table></div>
<p>强度以每分钟积冰厚度计：轻度 ≤0.6 mm/min、中度 0.6~1.0、重度 &gt;1.0。<strong>强积冰多在温度 -2~-10℃</strong> 的过冷水云中；翼尖与尾翼迎风面先积冰。</p>
<div class="callout warn"><span class="co-t">飞行关联</span>积冰使升力下降、阻力增大、操纵面卡阻；改出方法为改变高度或航向脱离结冰区（进入温度较高区域）。</div>
<div class="callout tip"><span class="co-t">考点速记</span>明冰最危险；强积冰温度 -2~-10℃；翼尖先结冰；改出=变高度/航向。</div>`},
{t:'m2-6',m:'m2',ti:'飞机颠簸与尾涡',s:'颠簸强度按载荷因数；尾涡在 3 海里内下降 120-150 m/min。',h:`<p>湍流使飞机产生不规则振颤。乱流分：热力（对流）乱流、动力乱流（地形/风切变）、晴空湍流（急流附近）。</p>
<h4>颠簸强度（按载荷因数变化 Δn）</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:24%"><col style="width:38%"><col style="width:38%"></colgroup>
<tr><th>等级</th><th>Δn</th><th>感受</th></tr>
<tr><td>轻度</td><td>0~0.5</td><td>轻微振颤</td></tr>
<tr><td>中度</td><td>0.5~1.0</td><td>操纵需用力、安全带</td></tr>
<tr><td>强/严重</td><td>&gt;1.0</td><td>飞机高度姿态突变</td></tr>
</table></div>
<p>飞机乱流涡旋尺度约 <strong>15~150 m</strong>；<strong>尾涡</strong>由翼尖拖出，<strong>下降速度约 120~150 m/min</strong>，在航空器后方 3 海里、下方 100~300 ft 形成下洗区，是起飞着陆间隔的依据。</p>
<div class="callout tip"><span class="co-t">考点速记</span>颠簸按 Δn；尾涡在后方 3 海里、下降 120~150 m/min；CAT 多在急流轴附近。</div>`},
{t:'m2-7',m:'m2',ti:'低空风切变',s:'四种风切变；强度分级；改出按波音标准保持/增大推力。',h:`<p>风切变指空间两点间风向风速突变；低空风切变指地面至约 1600 ft 之间。</p>
<h4>四种类型</h4>
<ul>
<li><strong>水平风切变</strong>：顺风/逆风突变；<strong>垂直风切变</strong>：上升/下沉气流突变；<strong>锋面切变</strong>；<strong>雷暴下击暴流切变</strong>（最危险）。</li>
</ul>
<h4>产生条件</h4>
<p>雷暴下击暴流、锋面、逆温层低空急流、山地地形、海陆风转换。</p>
<h4>波音改出标准</h4>
<ul>
<li>一旦在进近中识别低空风切变，立即<strong>复飞、保持/增大推力、拉杆至 VREF+适当姿态</strong>，继续带杆直到脱离切变。</li>
<li>避免在强切变下强行落地；提前复飞优于勉强着陆。</li>
</ul>
<div class="callout danger"><span class="co-t">飞行关联</span>下击暴流中心附近下沉气流可达几十 m/s，是进近阶段事故高发天气。</div>
<div class="callout tip"><span class="co-t">考点速记</span>四种切变=水平/垂直/锋面/下击暴流；改出=复飞+大推力+带杆。</div>`},
{t:'m2-8',m:'m2',ti:'热带气旋（台风）',s:'六等级；形成需暖洋面+地转偏向；命名表 140 个。',h:`<h4>等级（近中心最大持续风速）</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:30%"><col style="width:35%"><col style="width:35%"></colgroup>
<tr><th>名称</th><th>风速</th><th>风力</th></tr>
<tr><td>热带低压 TD</td><td>10.8~17.1 m/s</td><td>6~7 级</td></tr>
<tr><td>热带风暴 TS</td><td>17.2~24.4 m/s</td><td>8~9 级</td></tr>
<tr><td>强热带风暴 STS</td><td>24.5~32.6 m/s</td><td>10~11 级</td></tr>
<tr><td>台风 TY</td><td>32.7~41.4 m/s</td><td>12~13 级</td></tr>
<tr><td>强台风 STY</td><td>41.5~50.9 m/s</td><td>14~15 级</td></tr>
<tr><td>超强台风 SuperTY</td><td>≥51.0 m/s</td><td>16 级以上</td></tr>
</table></div>
<h4>形成四条件</h4>
<ul>
<li>海温 ≥26.5℃；纬度 ≥5°（需地转偏向力）；弱垂直风切变；初始扰动。</li>
</ul>
<p>命名由西北太平洋 14 国/地区各提供 10 个共 140 个循环使用。台风眼区微风晴朗、眼墙风雨最烈。警报分级：热带气旋警报、台风警报、紧急台风警报。</p>
<div class="callout tip"><span class="co-t">考点速记</span>海温≥26.5℃、纬度≥5°；命名 140 个；眼墙最危险。</div>`},
{t:'m2-9',m:'m2',ti:'寒潮与地面大风',s:'24/48/72h 降温标准；三个源地、四个路径。',h:`<p>寒潮是强冷空气大规模南下。我国规定：<strong>24h 降温 ≥8℃ 或 48h≥10℃ 或 72h≥12℃</strong>，且最低气温 ≤4℃。</p>
<ul>
<li><strong>三个源地</strong>：新地岛以北、以西；冰岛以南；喀拉海以东。冷空气经蒙古进入我国前汇聚于<strong>关键区</strong>（约 40~55°N、80~100°E）。</li>
<li><strong>四个路径</strong>：西路、中路、东路、东路加西路。</li>
</ul>
<p>大风：地面风力 ≥8 级为大风；寒潮常伴偏北大风、沙尘暴与剧烈降温。</p>
<div class="callout tip"><span class="co-t">考点速记</span>24h≥8/48h≥10/72h≥12 且最低≤4℃；三个源地、关键区、四个路径。</div>`},
{t:'m2-10',m:'m2',ti:'沙尘暴与火山灰',s:'扬沙/沙暴；火山灰由 VAAC 发布，9 个 VAAC。',h:`<ul>
<li><strong>扬沙</strong>：大风将地面沙尘卷起，水平能见度 1~10 km；<strong>沙尘暴</strong>：能见度 &lt;1 km。</li>
<li><strong>浮尘</strong>：无风或微风时沙尘悬浮，能见度 &lt;10 km。</li>
</ul>
<p><strong>火山灰</strong>由火山喷发进入对流层上部或平流层，对喷气发动机危害极大（吸入后熔堵涡轮、机体磨蚀）。1982 年英国航空 B747 飞入加隆贡火山灰云，四发全部停车，滑翔后重启，为经典案例。</p>
<ul>
<li>全球设 <strong>9 个 VAAC</strong>（火山灰咨询中心），其中伦敦、华盛顿、杜拜、东京、墨尔本、阿什哈巴德、蒙特利尔、布宜诺斯艾利斯、惠灵顿。</li>
<li>火山灰云颜色代码：红/琥珀/绿，分别对应区域内可能存在火山灰/需注意/无。</li>
<li>火山灰浓度分级：低/中/高。</li>
</ul>
<div class="callout danger"><span class="co-t">飞行关联</span>遇火山灰立即改变高度/航向脱离，避免吸入发动机。</div>
<div class="callout tip"><span class="co-t">考点速记</span>沙暴能见度&lt;1 km；9 个 VAAC；英航 B747 加隆贡案例；颜色代码红/琥珀/绿。</div>`},
{t:'m2-11',m:'m2',ti:'高空重要天气系统',s:'副高 588、槽线切变线、ITCZ、阻塞高压对飞行的影响。',h:`<ul>
<li><strong>西太平洋副热带高压</strong>：500 hPa 上以 588 位势什米线代表其范围，夏季北跳影响我国主雨带；副高内部下沉晴热，西侧多雷阵雨。</li>
<li><strong>槽线与切变线</strong>：槽线为低压槽中等压线曲率最大处连线；切变线为风向/风速不连续线，是我国东部夏季连阴雨的关键系统。</li>
<li><strong>热带辐合带 ITCZ</strong>：南北半球信风辐合带，对流旺盛，是台风胚胎源地。</li>
<li><strong>阻塞高压</strong>：中高纬稳定暖高压，使天气持续异常（长时间连阴雨或晴热）。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>588=副高；切变线连阴雨；ITCZ 在赤道辐合；阻塞高压使天气持久。</div>`},
{t:'m3-1',m:'m3',ti:'观测系统与地面观测',s:'自动观测+人工观测；观测项目分六类。',h:`<p>航空气象观测由<strong>自动气象观测系统（AWOS/AMOS）</strong>为主，辅以人工观测。观测项目：风向风速、气压、气温、露点、湿度、云、能见度、天气现象、降水与跑道视程 RVR。</p>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:26%"><col style="width:74%"></colgroup>
<tr><th>项目</th><th>说明</th></tr>
<tr><td>风</td><td>2 分钟平均风向风速；阵风为 10 秒极值；VRB 风向不定</td></tr>
<tr><td>云</td><td>量（FEW/SCT/BKN/OVC）+ 高（百尺 AGL）+ 类型（CB/TCU）</td></tr>
<tr><td>能见度</td><td>主导能见度（m）；RVR 跑道视程（m）</td></tr>
<tr><td>天气现象</td><td>现在天气 WW、过去天气 W1W2</td></tr>
<tr><td>气压</td><td>QNH（hPa）、QFE（仅本场/俄式 RMK）</td></tr>
<tr><td>温度露点</td><td>℃，零下加 M；能见度 9999 表示 ≥10 km</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span>风为 2 分钟平均；RVR 单位米；QNH 是 METAR 唯一气压组。</div>`},
{t:'m3-2',m:'m3',ti:'METAR/SPECI 报文结构',s:'六段式：报头+风+能见度+天气+云+温露/气压/趋势。',h:`<p><strong>METAR</strong> 为例行日常天气报告（每半小时/每小时），<strong>SPECI</strong> 为特殊天气报告（达到阈值随时发布）。</p>
<div class="code">ZBAA 080000Z 24008G14MPS 4000 -RA FEW033 BKN060 18/12 Q1015 NOSIG=</div>
<h4>六段拆解</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:24%"><col style="width:30%"><col style="width:46%"></colgroup>
<tr><th>段</th><th>示例</th><th>含义</th></tr>
<tr><td>报头</td><td><code>ZBAA 080000Z</code></td><td>北京首都机场 + 8 日 00:00 世界时</td></tr>
<tr><td>风</td><td><code>24008G14MPS</code></td><td>风向 240°、风速 8 m/s、阵风 14 m/s</td></tr>
<tr><td>能见度</td><td><code>4000</code></td><td>主导能见度 4000 m</td></tr>
<tr><td>天气</td><td><code>-RA</code></td><td>小毛毛雨/小雨</td></tr>
<tr><td>云</td><td><code>FEW033 BKN060</code></td><td>少云 3300 ft、多云 6000 ft</td></tr>
<tr><td>温露/气压/趋势</td><td><code>18/12 Q1015 NOSIG</code></td><td>气温 18℃ 露点 12℃、QNH 1015 hPa、无显著变化</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span>顺序固定：<b>风→能见度→天气→云→温露→气压→趋势</b>；时组 Z 为 UTC；趋势 NOSIG/BECMG/TEMPO。</div>`},
{t:'m3-3',m:'m3',ti:'TAF 航站预报',s:'按有效期发趋势；FM/BECMG/TEMPO/PROB 组管理变化。',h:`<p><strong>TAF</strong> 为机场着陆区 5 km 半径内的定时预报，有效期 9~30 h。</p>
<div class="code">TAF ZBAA 080000Z 0800/0906 24008G14MPS 4000 -RA BKN060 TX20/0800Z TN11/0812Z TEMPO 0803/0808 1200 +RA=</div>
<h4>变化指示组</h4>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:22%"><col style="width:78%"></colgroup>
<tr><th>组</th><th>含义</th></tr>
<tr><td><code>FMhhmm</code></td><td>从某时起条件完全改变</td></tr>
<tr><td><code>BECMG hhhh</code></td><td>在时段内逐渐变化</td></tr>
<tr><td><code>TEMPO hhhh</code></td><td>短时波动，每次≤1 小时、累计≤时段一半</td></tr>
<tr><td><code>PROB30/PROB40 hhhh</code></td><td>发生概率 30%/40%</td></tr>
<tr><td><code>INTER hhhh</code></td><td>短时波动，每次≤30 分钟</td></tr>
<tr><td><code>TX/TN</code></td><td>最高/最低气温及时间</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span>FM=完全改、BECMG=渐改、TEMPO=短时、PROB=概率；TAF 时效 9~30 h。</div>`},
{t:'m3-4',m:'m3',ti:'重要天气情报 SIGMET/AIRMET',s:'SIGMET 危险天气；AIRMET 中度不利天气；WS/WV/R 开头。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:22%"><col style="width:78%"></colgroup>
<tr><th>类型</th><th>范围与内容</th></tr>
<tr><td><strong>SIGMET</strong></td><td>航路区域危险天气：雷暴、强烈颠簸、强烈积冰、严重山地波、火山灰、热带气旋。以 <code>WS</code>（非气旋）、<code>WV</code>（火山灰）、<code>WR</code>（热带气旋）开头，时限 ≤4 h</td></tr>
<tr><td><strong>AIRMET</strong></td><td>航路中度不利天气：中度颠簸、中度积冰、顶高、能见度差、风。以 <code>WS</code> 后跟区域代码</td></tr>
</table></div>
<ul>
<li>时组为 UTC，如 <code>081200Z</code>；<code>CNL</code> 表示取消先前发布。</li>
<li>有效时段 <code>hhmm/hhmm</code>；超出即发新报文。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>WS=一般 SIGMET、WV=火山灰、WR=热带气旋；CNL=取消；时限≤4 h。</div>`},
{t:'m3-5',m:'m3',ti:'高空风温与重要天气预报图',s:'风羽读数；重要天气用符号。',h:`<p><strong>高空风温预报图</strong>（WINTEM）给出等压面位势高度、温度与风：风羽长羽 20 kt、短羽 10 kt、三角旗 50 kt，风杆指向风去方向。</p>
<p><strong>重要天气预报图</strong>（SWH）用符号标注雷暴、积冰、颠簸、急流、云顶。常见符号：实线雷暴区、点线雷暴区、积冰区斜线、颠簸区曲线。</p>
<div class="callout tip"><span class="co-t">考点速记</span>风羽 10/20/50 kt；风杆指向去向；SWH 看积冰颠簸雷暴区。</div>`},
{t:'m3-6',m:'m3',ti:'机载气象雷达',s:'衰减识别硬云；倾角与距离圈调节。',h:`<p>机载雷达探测前方降水粒子，硬云/雷暴回波强。</p>
<ul>
<li><strong>正常模式</strong>探测前方；<strong>衰减模式</strong>用于识别硬云（强回波后衰减穿透差）。</li>
<li>通过调节天线<strong>倾角</strong>避免地面杂波；距离圈选择 20/40/80/160 海里。</li>
<li>绕飞雷暴应从<strong>上风方向</strong>绕飞 ≥20 km；不要从云下或云间穿越。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>衰减模式辨硬云；绕飞≥20 km；避开云下。</div>`},
{t:'m3-7',m:'m3',ti:'飞行情报服务 ATIS/VOLMET',s:'ATIS 机场自动情报；VOLMET 航路对空气象广播。',h:`<ul>
<li><strong>ATIS</strong>：自动终端情报服务，录音循环播报本场频率、跑道、天气、过渡高度；每小时或变化时更新，以字母编号（A-Z）。</li>
<li><strong>VOLMET</strong>：航路对空气象广播，按区域在高频/甚高频频段循环播报 METAR/TAF。</li>
<li>频率：中波 ATIS 多为本地调频；VOLMET 按区域时间表守听。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>ATIS 字母编号逐次递增；VOLMET 按时间表守听；进近前必须收听 ATIS。</div>`},
{t:'m3-8',m:'m3',ti:'航空气象产品体系',s:'观测/预报/警报/咨询四大类。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:24%"><col style="width:76%"></colgroup>
<tr><th>类别</th><th>产品</th></tr>
<tr><td>观测</td><td>METAR/SPECI、机场天气报告、雷达回波、卫星云图</td></tr>
<tr><td>预报</td><td>TAF、区域预报、高空风温图、重要天气预报图、航线预报</td></tr>
<tr><td>警报</td><td>SIGMET、AIRMET、台风/火山灰警报、风切变警报</td></tr>
<tr><td>咨询</td><td>飞行前讲解、飞行中咨询、VAAC 火山灰咨询</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span>观测用过去时、预报用将来时；警报针对危险天气。</div>`},
{t:'mr-1',m:'m3',ti:'RMK 注释组',s:'RMK 起注释：SLP/6组/温度组/Z/RERA/PRESFR 等。',h:`<p><code>RMK</code> 起为自由注释，供飞行与预报员参考，不强制格式。常见注释组：</p>
<h4>气压与趋势</h4>
<ul>
<li><code>SLP###</code>：海平面气压千帕/十分位（如 SLP982=998.2 hPa）。</li>
<li><code>PRESFR/PRESRR</code>：气压正在快速上升/下降。</li>
<li><code>NSC/NCD</code>：无重要云/无云观测。</li>
</ul>
<h4>跑道与天气</h4>
<ul>
<li><code>RERA</code>：本场刚下过雨（跑道湿）。</li>
<li><code>SNOCLO</code>：跑道积雪关闭。</li>
<li><code>R##L/R##C</code>：具体跑道的 RVR 或天气。</li>
</ul>
<h4>温露点与风注释</h4>
<ul>
<li><code>T02120185</code>：自动站气温 21.2℃、露点 18.5℃（零下用 1 前导）。</li>
<li><code>6/////</code>：6 字组（云高自动观测缺测）。</li>
<li><code>Z</code>：观测为自动完成。</li>
</ul>
<h4>特殊天气</h4>
<ul>
<li><code>TS##</code>：雷暴方位/距离。</li>
<li><code>CB ALQDS/CB DSNT</code>：云底四方/远处有积雨云。</li>
<li><code>LTG</code>：雷电。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>RMK 起注释；SLP 海平面气压；RERA 跑道湿；T 组给精确温露点；Z=自动观测。</div>`},
{t:'m3-9',m:'m3',ti:'风组细化规则',s:'00000/VRB/190V270/阵风/VRB02MPS 的读法。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:26%"><col style="width:74%"></colgroup>
<tr><th>写法</th><th>含义</th></tr>
<tr><td><code>24008MPS</code></td><td>风向 240°，风速 8 m/s</td></tr>
<tr><td><code>24008G14MPS</code></td><td>平均 8 m/s，阵风最大 14 m/s</td></tr>
<tr><td><code>00000MPS</code></td><td>静风（0 节以下）</td></tr>
<tr><td><code>VRB02MPS</code></td><td>风向不定，风速 2 m/s</td></tr>
<tr><td><code>190V270</code></td><td>风向在 190°~270° 之间摆动（仅当变化≥60°且≥3 kt 时报）</td></tr>
<tr><td><code>9999</code></td><td>非风组；能见度 ≥10 km</td></tr>
</table></div>
<p>风单位：<code>KT</code>=节、<code>MPS</code>=米/秒、<code>KMH</code>=千米/时；1 m/s≈1.94 kt。阵风 G 后为最大 10 秒平均。</p>
<div class="callout tip"><span class="co-t">考点速记</span>00000=静风；VRB=风向不定；V 组风向摆动；G=阵风。</div>`},
{t:'m3-10',m:'m3',ti:'能见度与 RVR 组',s:'9999/CAVOK/R18L/0/9999V 的读法。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:26%"><col style="width:74%"></colgroup>
<tr><th>写法</th><th>含义</th></tr>
<tr><td><code>9999</code></td><td>主导能见度 ≥10 km</td></tr>
<tr><td><code>CAVOK</code></td><td>能见度≥10 km、无 5000 ft 以下云、无重要天气（三条件同时满足）</td></tr>
<tr><td><code>R18L/1200</code></td><td>18 号左跑道 RVR 1200 m</td></tr>
<tr><td><code>R18L/1200D</code></td><td>RVR 在下降；U 表示上升、N 表示无变化</td></tr>
<tr><td><code>R18L/0</code></td><td>RVR &lt;50 m</td></tr>
<tr><td><code>R18L/9999V1500</code></td><td>RVR 在 1500~9999 m 之间变化</td></tr>
</table></div>
<ul>
<li>RVR 报至最近 25 m（&lt;800）或最近 50 m（≥800）；最大 1500 m 报 <code>P1500</code>，最小 &lt;50 报 <code>M0050</code>。</li>
<li>主导能见度报至最近百米；&lt;800 报米。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>CAVOK 三条件；RVR 单位米；D=下降/U=上升。</div>`},
{t:'m3-11',m:'m3',ti:'现在天气组（W'+'W）',s:'现象+强度/描述词+降水/视程障碍三列组合。',h:`<p>现在天气组最多 3 组，按"强度/描述+现象"组合。</p>
<h4>强度与描述词（前缀）</h4>
<ul>
<li>强度：<code>-</code> 轻、<code>+</code> 强、无符号为中。</li>
<li>描述：<code>MI</code> 浅、<code>BC</code> 碎、<code>DR</code> 低吹、<code>BL</code> 高吹、<code>SH</code> 阵性、<code>TS</code> 雷暴、<code>FZ</code> 冻。</li>
</ul>
<h4>降水（现象）</h4>
<ul>
<li><code>DZ</code> 毛毛雨、<code>RA</code> 雨、<code>SN</code> 雪、<code>PL</code> 冰粒、<code>GR</code> 冰雹、<code>GS</code> 霰。</li>
</ul>
<h4>视程障碍（现象）</h4>
<ul>
<li><code>BR</code> 轻雾、<code>FG</code> 雾、<code>FU</code> 烟、<code>HZ</code> 霾、<code>DU</code> 浮尘、<code>SA</code> 沙、<code>VA</code> 火山灰、<code>DU/SA</code> 扬沙沙暴。</li>
</ul>
<p>示例：<code>-DZ</code> 小毛毛雨、<code>+SHRA</code> 强阵雨、<code>FZRA</code> 冻雨、<code>BCFG</code> 碎雾、<code>BLSA</code> 高吹沙。</p>
<div class="callout tip"><span class="co-t">考点速记</span>前缀强度+描述，后接现象；SH=阵性、FZ=冻、TS=雷暴。</div>`},
{t:'m3-12',m:'m3',ti:'云组',s:'FEW/SCT/BKN/OVC/NSC/NCD/VV/CB/TCU 的量与高。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:22%"><col style="width:30%"><col style="width:48%"></colgroup>
<tr><th>组</th><th>云量</th><th>含义</th></tr>
<tr><td><code>FEW</code></td><td>1~2/8</td><td>少云</td></tr>
<tr><td><code>SCT</code></td><td>3~4/8</td><td>疏云</td></tr>
<tr><td><code>BKN</code></td><td>5~7/8</td><td>多云</td></tr>
<tr><td><code>OVC</code></td><td>8/8</td><td>阴天</td></tr>
<tr><td><code>NSC</code></td><td>—</td><td>无重要云（无 5000 ft 以下且非 CB/TCU）</td></tr>
<tr><td><code>NCD</code></td><td>—</td><td>无云（自动站未观测到）</td></tr>
<tr><td><code>VV///</code></td><td>—</td><td>云底不可见（垂直能见度未知）</td></tr>
</table></div>
<ul>
<li>云高单位为<strong>百尺 AGL</strong>：<code>FEW033</code>=云底 3300 ft。</li>
<li>附加类型：<code>CB</code> 积雨云、<code>TCU</code> 浓积云，必报。</li>
<li>最多报 5 层；最低若干层低于 5000 ft 或为 CB/TCU 必须报。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>FEW1-2/SCT3-4/BKN5-7/OVC8；云高=百尺；CB/TCU 必报。</div>`},
{t:'m3-13',m:'m3',ti:'温度露点与 QNH 组',s:'M02/10/02、Q1013、NOSIG/BECMG/TEMPO/PROB30/INTER。',h:`<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:26%"><col style="width:74%"></colgroup>
<tr><th>写法</th><th>含义</th></tr>
<tr><td><code>18/12</code></td><td>气温 18℃，露点 12℃</td></tr>
<tr><td><code>M02/00</code></td><td>气温 -2℃，露点 0℃</td></tr>
<tr><td><code>Q1015</code></td><td>QNH 1015 hPa</td></tr>
<tr><td><code>A2992</code></td><td>QNH 29.92 inHg（美式）</td></tr>
<tr><td><code>NOSIG</code></td><td>未来 2 小时无显著变化</td></tr>
<tr><td><code>BECMG 0812/0814</code></td><td>在时段内逐渐变化</td></tr>
<tr><td><code>TEMPO 0812/0814</code></td><td>短时波动</td></tr>
<tr><td><code>PROB30 TEMPO</code></td><td>30% 概率短时</td></tr>
<tr><td><code>INTER 0812/0814</code></td><td>短时波动（≤30 min）</td></tr>
</table></div>
<p>零下温度用 <code>M</code> 前缀（M02=-2℃）；QNH 三位或四位 hPa，美式用英寸汞柱。趋势组在 METAR 末两位时效，TAF 用 FM/BECMG/TEMPO/PROB。</p>
<div class="callout tip"><span class="co-t">考点速记</span>M=零下；Q=QNH；NOSIG 仅 2 小时；PROB30/40 概率。</div>`},

{t:'m4-1',m:'m4',ti:'雷暴',s:'三阶段；绕飞≥20 km；成熟阶段最危险。',h:`<p>雷暴是飞行中最危险的天气之一：伴随强颠簸、积冰、下击暴流、冰雹与雷击。</p>
<h4>对飞行的危害</h4>
<ul>
<li>强烈升降气流造成严重颠簸与载荷超限；</li>
<li>过冷水滴造成积冰；冰雹打坏机体；</li>
<li>闪电干扰通信并可能损坏设备；</li>
<li>云下下击暴流造成低空风切变。</li>
</ul>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:22%"><col style="width:38%"><col style="width:40%"></colgroup>
<tr><th>阶段</th><th>气流</th><th>飞行对策</th></tr>
<tr><td>积云</td><td>上升</td><td>避免进入</td></tr>
<tr><td>成熟</td><td>上升+下沉</td><td>最危险，绕飞≥20 km</td></tr>
<tr><td>消散</td><td>下沉</td><td>仍有下沉气流与风切变</td></tr>
</table></div>
<div class="callout danger"><span class="co-t">运行要点</span>绕飞雷暴上风方向 ≥20 km；严禁穿越；机载雷达用于定位回波强中心。</div>
<div class="callout tip"><span class="co-t">考点速记</span>三条件水汽+不稳定+抬升；成熟阶段最强；绕飞≥20 km。</div>`},
{t:'m4-2',m:'m4',ti:'下击暴流',s:'强下沉气流；直径4-40 km；对起飞进近最危险。',h:`<p>下击暴流是雷暴云下的强下沉气流，到达地面后向外扩散，造成低空风切变。</p>
<ul>
<li>微下击暴流直径 &lt;4 km，下沉速度可达 10~30 m/s；</li>
<li>宏下击暴流直径 4~40 km；</li>
<li>典型危害：进近中先遇顺风→升力下降→飞行员加油门→下沉气流突至→触地。</li>
</ul>
<div class="callout danger"><span class="co-t">运行要点</span>识别征兆：云底缩尾状下垂、地面强降雨、温度骤降、气压鼻。改出=复飞+大推力+带杆。</div>
<div class="callout tip"><span class="co-t">考点速记</span>微下击暴流&lt;4 km；下沉 10~30 m/s；进近阶段最危险。</div>`},
{t:'m4-3',m:'m4',ti:'低空风切变',s:'四种类型；进近改出程序。',h:`<p>地面至 1600 ft 间风向风速突变。</p>
<h4>类型</h4>
<ul>
<li>水平切变（顺风/逆风突变）；垂直切变（升降气流）；锋面切变；雷暴下击暴流切变。</li>
</ul>
<h4>改出程序</h4>
<ul>
<li>识别：多普勒雷达告警、空速表突变、高度异常；</li>
<li>立即复飞，保持/增大推力至 TOGA；</li>
<li>带杆至 VREF+适当姿态，保持俯仰直到脱离切变；</li>
<li>避免在强切变下勉强着陆。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>四种切变；改出=复飞+TOGA+带杆；1600 ft 以下。</div>`},
{t:'m4-4',m:'m4',ti:'低能见度运行',s:'VIS/RVR 分级；低能见度程序 LVP。',h:`<p>低能见度是进近着陆主要威胁。按 RVR 决定运行等级。</p>
<div class="tbl-wrap"><table class="tbl">
<colgroup><col style="width:30%"><col style="width:38%"><col style="width:32%"></colgroup>
<tr><th>RVR</th><th>运行</th><th>典型设施</th></tr>
<tr><td>≥550 m</td><td>CAT I 常规进近</td><td>常规 ILS</td></tr>
<tr><td>300~550 m</td><td>低能见度程序 LVP</td><td>II类运行</td></tr>
<tr><td>≥200 m</td><td>II类运行</td><td>II类 ILS</td></tr>
<tr><td>≥150 m</td><td>IIIa 类运行</td><td>III类 ILS+自动驾驶</td></tr>
<tr><td>≥75 m</td><td>IIIb 类运行</td><td>自动着陆</td></tr>
<tr><td>&lt;75 m</td><td>IIIc 运行</td><td>无滑出引导</td></tr>
</table></div>
<div class="callout tip"><span class="co-t">考点速记</span>CAT I≥550 m、II≥300 m、IIIa≥200 m、IIIb≥75 m；LVP 在 RVR&lt;550 m 启动。</div>`},
{t:'m4-5',m:'m4',ti:'飞机积冰运行',s:'明冰最危险；-2~-10℃ 强积冰；改出变高度。',h:`<ul>
<li>明冰透明坚硬、附着强，危害最大；</li>
<li>强积冰温度 -2~-10℃，由大过冷水滴形成；</li>
<li>翼尖与尾翼先积冰，影响升力与操纵。</li>
</ul>
<h4>运行对策</h4>
<ul>
<li>飞行前检查机体霜冰；</li>
<li>进入结冰区前打开防冰/除冰装置；</li>
<li>识别积冰后立即改变高度或航向脱离（进入温度较高或无过冷水区）；</li>
<li>严重积冰时着陆重量增加，注意进场速度。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>明冰最危险；改出=变高度/航向；-2~-10℃。</div>`},
{t:'m4-6',m:'m4',ti:'颠簸运行',s:'按 Δn 分级；绕飞急流轴。',h:`<ul>
<li>轻度 Δn 0~0.5、中度 0.5~1.0、严重 &gt;1.0；</li>
<li>热力乱流在对流云区；动力乱流在山脉背风面；晴空湍流 CAT 在急流轴附近；</li>
<li>对策：调整速度至颠簸穿透速度，绕飞 CAT 区，提醒乘客系安全带。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>按 Δn 分级；颠簸穿透速度；CAT 在急流附近。</div>`},
{t:'m4-7',m:'m4',ti:'台风运行',s:'六等级；绕飞眼墙；机场关闭决策。',h:`<ul>
<li>台风眼区微风，眼墙风雨最强；</li>
<li>北半球台风逆时针旋转，右半圆危险半圆风速叠加；</li>
<li>机场在台风来临前关闭，航空器转场备降；</li>
<li>绕飞应避开眼墙至少几十海里，不从台风中心附近穿越。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>右半圆危险；眼墙最烈；机场提前关闭转场。</div>`},
{t:'m4-8',m:'m4',ti:'火山灰运行',s:'吸入熔堵发动机；VAAC 发布；立即脱离。',h:`<ul>
<li>火山灰熔融后在涡轮叶片上凝固，造成发动机喘振停车；</li>
<li>VAAC 发布火山灰咨询与颜色代码；</li>
<li>飞行中遇火山灰立即改变高度/航向脱离，避免吸入；</li>
<li>英航 B747 加隆贡案例：四发停车滑翔后重启。</li>
</ul>
<div class="callout danger"><span class="co-t">运行要点</span>收到 VAAC 警告即改航；不穿越红色区域。</div>
<div class="callout tip"><span class="co-t">考点速记</span>9 个 VAAC；颜色红/琥珀/绿；立即脱离。</div>`},
{t:'m4-9',m:'m4',ti:'地面除防冰',s:'两次除冰；保持时间检查；清洁机体标准。',h:`<h4>清洁机体标准</h4>
<ul>
<li>机翼/操纵面不得有霜、雪、冰；机翼上表面"感觉法"与目视检查；</li>
<li>残留霜厚度不得超过机型规定。</li>
</ul>
<h4>除防冰程序</h4>
<ul>
<li><strong>一步法</strong>：用热除冰液一次完成；</li>
<li><strong>两步法</strong>：第一步热液除冰，第二步凝胶防冰；</li>
<li><strong>保持时间</strong>：从防冰液喷涂完成起，按液型号与外界温度计时；超时重复检查；</li>
<li>起飞前驾驶舱绕机检查确认无可见霜冰雪。</li>
</ul>
<div class="callout warn"><span class="co-t">运行要点</span>保持时间内未起飞须重新除冰；不要凭"已喷防冰"假设机体清洁。</div>
<div class="callout tip"><span class="co-t">考点速记</span>清洁机体；两步法；保持时间计时；超时重除。</div>`},
{t:'m4-10',m:'m4',ti:'飞行前气象讲解与天气图使用',s:'起飞前讲解内容；天气图判读顺序。',h:`<p>飞行前应向气象预报员或通过系统获取：起飞机场、航路、目的地与备降场的天气，以及 SIGMET/AIRMET。</p>
<ul>
<li><strong>地面图</strong>看高低压、锋面、雷暴区；</li>
<li><strong>等压面图</strong>看槽脊、急流、副高；</li>
<li><strong>T-lnP 图</strong>看对流潜势；</li>
<li><strong>SIGMET/AIRMET</strong>看航路危险天气区；</li>
<li><strong>TAF</strong>看目的地与备降场变化。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>讲解覆盖起飞/航路/目的/备降四张图；SIGMET 必看。</div>`},
{t:'m4-11',m:'m4',ti:'进近着陆最低标准',s:'DA/H、MDA/H、VIS/RVR 三要素。',h:`<ul>
<li><strong>精密进近</strong>：以 <strong>DH</strong>（决断高）为界，到 DH 未见跑道即复飞；</li>
<li><strong>非精密进近</strong>：以 <strong>MDH</strong>（最低下降高）为参考，可在 MDA 平飞；</li>
<li>目视参考要求：见跑道灯光/标志；</li>
<li>着陆最低标准由机场、机型、机组资质与设施决定。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>精密=DH 即复飞；非精密=MDH 可平飞；RVR 决定运行类别。</div>`},
{t:'m4-12',m:'m4',ti:'备降场天气要求',s:'目的地天气低于着陆最低时必须选备降场。',h:`<ul>
<li>起飞机场必须有天气低于着陆最低标准时的备降方案；</li>
<li>目的地预报在到达前后 1 小时天气低于着陆最低标准，须选择备降场；</li>
<li>备降场天气须高于备降最低标准；</li>
<li>燃油计划需考虑等待与备降航程。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>目的地天气差→选备降；备降场天气须高于备降标准。</div>`},
{t:'m4-13',m:'m4',ti:'巡航绕飞与改航',s:'绕飞雷暴≥20 km；改航避开火山灰与台风。',h:`<ul>
<li>雷暴绕飞上风方向 ≥20 km；</li>
<li>火山灰按 VAAC 咨询避开红色区域；</li>
<li>台风绕飞眼墙几十海里；</li>
<li>绕飞增加油量，需评估剩余燃油。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>绕飞间距+油量评估并重。</div>`},
{t:'m4-14',m:'m4',ti:'结冰区识别与脱离',s:'温度-2~-10℃ 过冷水云；变高度/航向脱离。',h:`<ul>
<li>云中温度 -2~-10℃ 且有过冷水滴时易积冰；</li>
<li>机翼/风挡出现可见积冰即启动防除冰；</li>
<li>脱离方法：升高（进入-40℃冰晶区）或下降到 0℃ 以上，或改变航向；</li>
<li>严重积冰不得继续进近。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>-2~-10℃ 强积冰；变高度/航向脱离。</div>`},
{t:'m4-15',m:'m4',ti:'冬季污染跑道着陆性能',s:'污染跑道增加滑跑距离。',h:`<ul>
<li>污染跑道（积水/雪/冰）刹车效应差，滑跑距离增长；</li>
<li>湿跑道刹车效应分级：好/中/差/很差；</li>
<li>着陆前评估刹车效应报告与跑道状况代码；</li>
<li>必要时选择长跑道或推迟着陆。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>污染跑道滑跑增长；看刹车效应报告。</div>`},
{t:'m5-1',m:'m5',ti:'ICAO 附件三',s:'航空气象服务国际标准与建议措施。',h:`<p><strong>ICAO 附件三（Annex 3）《国际航空气象服务》</strong>是各国航空气象服务的国际标准，规定观测、预报、情报交换与服务机构职责。</p>
<ul>
<li>观测：METAR/SPECI、自动观测、地面/高空观测；</li>
<li>预报：TAF、区域预报、高空风温、重要天气预报；</li>
<li>警报：SIGMET、AIRMET、火山灰与热带气旋咨询、机场警报、风切变警报；</li>
<li>情报交换：通过 WIFS 与区域信息交换。</li>
</ul>
<div class="callout tip"><span class="co-t">考点速记</span>附件三=航空气象服务国际总章；规定观测/预报/警报/交换。</div>`},
{t:'m5-2',m:'m5',ti:'CCAR-117-R2',s:'中国民用航空气象工作规则。',h:`<p><strong>CCAR-117-R2《民用航空气象工作规则》</strong>是我国航空气象工作的部门规章，规定服务机构、人员、观测预报与情报交换。</p>
<ul>

/* ============ 路由 ============ */
function route(){
  var h=location.hash||'#/';
  window.__closeSb && window.__closeSb();
  if(h.indexOf('#/quiz')===0){ buildSidebar('quiz'); renderQuiz(); }
  else if(h.indexOf('#/topic/')===0){
    var id=h.slice(8);

  }
  window.scrollTo(0,0);
}

/* ============ 搜索 ============ */
(function(){
  var input=document.getElementById('searchInput');
  var clear=document.getElementById('searchClear');
  var box=document.getElementById('srResults');
  function doSearch(){
    var q=input.value.trim().toLowerCase();
    if(q.length<1){ box.classList.remove('show'); box.innerHTML=''; return; }
    var res=[];
    TOPICS.forEach(function(t){
      var txt=(t.ti+' '+t.s+' '+stripHtml(t.h)).toLowerCase();
      if(t.ti.toLowerCase().indexOf(q)>=0 || txt.indexOf(q)>=0){ res.push(t); }
    });
    res=res.slice(0,12);
    if(!res.length){ box.innerHTML='<div class="sr-item"><div class="sr-t">无匹配</div></div>'; }
    else{
      box.innerHTML=res.map(function(t){
        return '<div class="sr-item" data-id="'+t.t+'"><div class="sr-t">'+t.ti+'</div><div class="sr-m">'+modName(t.m)+'</div><div class="sr-s">'+t.s+'</div></div>';
      }).join('');
      Array.prototype.forEach.call(box.children, function(el){
        el.addEventListener('click', function(){
          location.hash='#/topic/'+el.getAttribute('data-id');
          box.classList.remove('show'); input.value=''; clear.classList.remove('show');
        });
      });
    }
    box.classList.add('show');
  }
  input.addEventListener('input', function(){ clear.classList.toggle('show', input.value.length>0); doSearch(); });
  clear.addEventListener('click', function(){ input.value=''; clear.classList.remove('show'); box.classList.remove('show'); input.focus(); });
  document.addEventListener('click', function(e){
    if(!box.contains(e.target) && e.target!==input) box.classList.remove('show');
  });
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && document.activeElement!==input){ e.preventDefault(); input.focus(); }
  });
})();

var GLOSSARY={
 'METAR':'例行航空天气报告','SPECI':'特殊天气报告','TAF':'航站预报','TEMPO':'短时波动','BECMG':'逐渐变化',
 'FM':'从某时起改变','PROB30':'概率30%','PROB40':'概率40%','INTER':'短时(≤30min)','CNL':'取消','AMD':'修订',
 'COR':'更正','NIL':'无报文','NOSIG':'未来2h无显著变化','UTC':'世界时','Z':'世界时','QNH':'修正海平面气压',
 'QFE':'场面气压','QNE':'标准海平面气压1013.25','SLP':'海平面气压(RMK)','PRESFR':'气压快速上升','PRESRR':'气压快速下降',
 'VRB':'风向不定','G':'阵风','KT':'节','MPS':'米每秒','KMH':'千米每小时','CAVOK':'好天气','FEW':'少云1-2/8',
 'SCT':'疏云3-4/8','BKN':'多云5-7/8','OVC':'阴天8/8','NSC':'无重要云','NCD':'无云','SKC':'晴','CLR':'无云',
 'VV':'垂直能见度/云底不可见','CB':'积雨云','TCU':'浓积云','DZ':'毛毛雨','RA':'雨','SN':'雪','PL':'冰粒',
 'GR':'冰雹','GS':'霰','SH':'阵性','TS':'雷暴','FZ':'冻','MI':'浅','BC':'碎','DR':'低吹','BL':'高吹',
 'BR':'轻雾','FG':'雾','FU':'烟','HZ':'霾','DU':'浮尘','SA':'沙','VA':'火山灰','RERA':'刚下雨(跑道湿)',
 'TSRA':'雷暴雨','LTG':'闪电','SIGMET':'危险天气情报','AIRMET':'中度天气情报','WS':'SIGMET(一般)','WV':'火山灰SIGMET',
 'WR':'热带气旋SIGMET','ATIS':'自动终端情报服务','VOLMET':'航路对空气象广播','RVR':'跑道视程',
 'TX':'最高气温','TN':'最低气温','A':'英寸汞柱QNH','M':'零下','ALQDS':'云底四方','DSNT':'远处','SNOCLO':'跑道积雪关闭'
};
var GLOSSARY_COUNT=Object.keys(GLOSSARY).length;
function classify(tok){
  if(/^(METAR|SPECI|TAF)$/.test(tok)) return ['t-fmt','报文类型 '+tok];
  if(/^\d{6}Z$/.test(tok)) return ['t-time','观测时间 (UTC)'];
  if(/^\d{3}V\d{3}$/.test(tok)) return ['t-wind','风向在 '+tok+' 间摆动'];
  if(/^VRB\d{2,3}(MPS|KT|KMH)$/.test(tok)) return ['t-wind','风向不定，风速 '+tok.slice(3)];
  if(/^\d{5}(G\d{2,3})?(MPS|KT|KMH)$/.test(tok)){
    var d=tok; return ['t-wind','风向风速组'];
  }
  if(tok==='CAVOK') return ['t-vis','CAVOK：能见度≥10km且无低云无重要天气'];
  if(/^\d{4}$/.test(tok)) return ['t-vis','主导能见度 '+tok+' m'];
  if(/^R\d{2}[LRC]?\/(P|M)?\d{4}(U|D|N)?$/.test(tok)) return ['t-vis','跑道视程 RVR'];
  if(/^(FEW|SCT|BKN|OVC|VV|NSC|NCD|SKC|CLR)\d{3}(CB|TCU)?$/.test(tok) || /^(NSC|NCD|SKC|CLR)$/.test(tok)) return ['t-cloud','云组'];
  if(/^(-|\+)?(MI|BC|DR|BL|SH|TS|FZ)?(DZ|RA|SN|PL|GR|GS|BR|FG|FU|HZ|DU|SA|VA|PO|SQ|FC)$/.test(tok) || /^(TSRA|RERA|TSGS|TSGR|TSUP|TSRASN|BR|FG)$/.test(tok)) return ['t-wx','现在天气'];
  if(/^M?\d{2}\/M?\d{2}$/.test(tok)) return ['t-temp','温度 / 露点'];
  if(/^Q\d{4}$/.test(tok)) return ['t-qnh','QNH 修正海平面气压 '+tok.slice(1)+' hPa'];
  if(/^A\d{4}$/.test(tok)) return ['t-qnh','QNH '+tok.slice(1,3)+'.'+tok.slice(3)+' inHg'];
  if(/^(NOSIG|BECMG|TEMPO|INTER|PROB\d\d|CNL|AMD|COR|NIL|RMK|TX|TN|WS|WV|WR)$/.test(tok)) return ['t-trend', GLOSSARY[tok]||tok];
  if(/^\d{6}Z?$/.test(tok)) return ['t-time','时组'];
  if(GLOSSARY[tok]) return ['t-meta',GLOSSARY[tok]];
  return ['t-meta',tok];
}

/* ============ 自测逻辑 ============ */
(function(){
  var order=[]; var qi=0, score=0, answered=false, mode='all';
  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t;} return a; }
  function pick(){
    if(mode==='all') return shuffle(QDATA.slice());
    return shuffle(QDATA.filter(function(q){return q.t && q.t.indexOf(mode)===0;}));
  }
  function renderQuiz(){
    order=pick(); qi=0; score=0;
    var v=document.getElementById('view');
    var chips='<div class="quiz-toolbar">'
      +'<button class="q-chip on" data-m="all">全部 ('+QDATA.length+')</button>'
      +MODULES.map(function(m){ var n=QDATA.filter(function(q){return q.t&&q.t.indexOf(m.id)===0;}).length; return '<button class="q-chip" data-m="'+m.id+'">'+m.title+' ('+n+')</button>';}).join('')
      +'<span class="q-progress" id="qProg"></span></div>';
    v.innerHTML=chips+'<div id="qBody"></div>';
    Array.prototype.forEach.call(v.querySelectorAll('.q-chip'), function(btn){
      btn.addEventListener('click', function(){
        Array.prototype.forEach.call(v.querySelectorAll('.q-chip'), function(b){b.classList.remove('on');});
        btn.classList.add('on'); mode=btn.getAttribute('data-m'); order=pick(); qi=0; score=0; renderOne();
      });
    });
    renderOne();
  }
  function renderOne(){
    var v=document.getElementById('view');
    var body=document.getElementById('qBody');
    if(qi>=order.length){
      var best=null; try{best=parseInt(localStorage.getItem('amkb_quizbest')||'0',10);}catch(e){}
      if(score>best){ try{localStorage.setItem('amkb_quizbest', String(score));}catch(e){} }
      body.innerHTML='<div class="card q-done"><div class="big">'+score+'/'+order.length+'</div><div class="sub">正确率 '+Math.round(score/order.length*100)+'%</div><button class="q-next" onclick="window.location.reload()">再来一组</button><div class="q-best">历史最好：'+(best||'-')+'</div></div>';
      return;
    }
    var item=order[qi]; answered=false;
    document.getElementById('qProg').textContent='第 '+(qi+1)+' / '+order.length+' 题 · 已对 '+score;
    var opts='ABCD'.split('').map(function(L,i){
      return '<button class="q-opt" data-i="'+i+'"><span class="q-letter">'+L+'</span>'+item.o[i]+'</button>';
    }).join('');
    body.innerHTML='<div class="card q-card"><div class="q-meta"><span class="chip blue">'+(item.t||'')+'</span><span class="chip">第 '+(qi+1)+' 题</span></div><div class="q-text">'+item.q+'</div>'+opts
      +'<div class="q-exp" id="qExp"><b>解析：</b>'+item.e+' <a href="#/topic/'+item.t+'">查看知识点</a></div>'
      +'<div class="q-next"><button id="qNext" disabled>下一题</button></div></div>';
    Array.prototype.forEach.call(body.querySelectorAll('.q-opt'), function(btn){
      btn.addEventListener('click', function(){
        if(answered) return; answered=true;
        var i=parseInt(btn.getAttribute('data-i'),10);
        if(i===item.a){ btn.classList.add('correct'); score++; }
        else{ btn.classList.add('wrong'); body.querySelectorAll('.q-opt')[item.a].classList.add('correct'); }
        Array.prototype.forEach.call(body.querySelectorAll('.q-opt'), function(b){b.disabled=true;});
        document.getElementById('qExp').classList.add('show');
        document.getElementById('qNext').disabled=false;
        document.getElementById('qProg').textContent='第 '+(qi+1)+' / '+order.length+' 题 · 已对 '+score;
      });
    });
    document.getElementById('qNext').addEventListener('click', function(){ qi++; renderOne(); window.scrollTo(0,0); });
  }
  window.renderQuiz=renderQuiz;
})();

/* ============ 解码器 ============ */
(function(){
  var wrap=document.createElement('div');
})();
function runDecoder(){
  var input=(document.getElementById('decInput')||{}).value||'';
  var out=document.getElementById('decOut');
  if(!out) return;
  var toks=input.trim().split(/\s+/).filter(Boolean);
  var html='<div class="tbl-wrap"><table class="tbl"><colgroup><col style="width:26%"><col style="width:74%"></colgroup><tr><th>词素</th><th>释义</th></tr></thead>';
  toks.forEach(function(tok){
    var r=classify(tok);
    html+='<tr><td><span class="d-tok tok '+r[0]+'">'+escHtml(tok)+'</span></td><td class="d-exp">'+escHtml(r[1])+'</td></tr>';
  });
  html+='</table></div>';
  out.innerHTML=html; out.classList.add('show');
}

}
